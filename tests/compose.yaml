name: web-ssh-workspace-fixtures
services:
  ssh:
    build: ./fixtures
    ports: ["127.0.0.1:22222:22"]
    volumes:
      - ${FIXTURE_KEY_DIR:-./.fixture-key}:/fixture-key:ro
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:55433:5432"]
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace_test
      POSTGRES_DB: workspace_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workspace -d workspace_test"]
      interval: 1s
      timeout: 2s
      retries: 30
